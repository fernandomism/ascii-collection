<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ascii bugs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@600&display=swap" rel="stylesheet" />
    <style>
      /* One deliberate look: a black cell grid, like a terminal at night. */
      :root {
        --bg: #000; --ui: #7d8290; --ui-dim: #5b606c; --ui-on: #f4f4f4;
        --mono: "Geist Mono", ui-monospace, Menlo, monospace;
        color-scheme: dark;
      }
      html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
      canvas { display: block; width: 100%; height: 100%; font-family: var(--mono); }
      nav {
        position: fixed;
        top: calc(12px + env(safe-area-inset-top, 0px));
        left: max(16px, env(safe-area-inset-left, 0px));
        right: max(16px, env(safe-area-inset-right, 0px));
        display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: baseline;
        font: 600 13px/1.6 var(--mono); color: var(--ui);
        text-shadow: 0 0 3px var(--bg), 0 0 6px var(--bg), 0 0 9px var(--bg); /* legible over bugs passing underneath */
        pointer-events: none; /* clicks between the controls reach the bugs */
      }
      nav a, nav button { pointer-events: auto; color: inherit; text-decoration: none; background: none; border: 0; padding: 2px 0; font: inherit; cursor: pointer; }
      nav a:hover, nav button:hover, nav a[aria-current="page"], nav button[aria-pressed="true"] { color: var(--ui-on); }
      nav a:focus-visible, nav button:focus-visible { outline: 1px solid var(--ui-on); outline-offset: 2px; }
      #hint { color: var(--ui-dim); }
      #lights:not([hidden]) { display: inline-flex; gap: 14px; }
    </style>
  </head>
  <body>
    <canvas aria-hidden="true"></canvas>
    <nav aria-label="Bugs">
      <a href="#moths">[moths]</a>
      <a href="#beetles">[beetles]</a>
      <a href="#ants">[ants]</a>
      <span id="looks" role="group" aria-label="Colour">
        <button type="button" data-look="color" aria-pressed="true">color</button> /
        <button type="button" data-look="grey" aria-pressed="false">grey</button>
      </span>
      <span id="modes" role="group" aria-label="Moth mode" hidden>
        <button type="button" data-mode="fly" aria-pressed="false">fly</button> /
        <button type="button" data-mode="crawl" aria-pressed="false">crawl</button>
      </span>
      <span id="lights" role="group" aria-label="Moth lights" hidden>
        <button type="button" data-light="lamp" aria-pressed="true">[x] lamp</button>
        <button type="button" data-light="cursor" aria-pressed="true">[x] cursor light</button>
      </span>
      <span id="hint" aria-live="off"></span>
    </nav>
    <script type="module" src="/demo.ts"></script>
  </body>
</html>
