<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ASCII Collection</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@600&display=swap" rel="stylesheet" />
    <style>
      /* Layout: a terminal-black page on a faint cell grid; scenes in card rows by kind, each opening full-bleed. */
      :root {
        --bg: #0a0a0b;
        --panel: #121214;
        --line: #26262b;
        --line-hover: #4a4a54;
        --fg: #ececee;
        --muted: #8c8c96;
        --chip-color: #e8a25a;
        --chip-grey: #b9c2d6;
        --mono: "Geist Mono", ui-monospace, Menlo, monospace;
        --sans: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
        color-scheme: dark;
      }
      [hidden] { display: none !important; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background-color: var(--bg);
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
        background-size: 12px 17px;
        color: var(--fg);
        font: 400 15px/1.55 var(--sans);
      }
      .wrap {
        max-width: 1180px;
        margin: 0 auto;
        padding-block: 48px 64px;
        padding-left: max(16px, env(safe-area-inset-left, 0px));
        padding-right: max(16px, env(safe-area-inset-right, 0px));
        display: grid;
        gap: 40px;
      }
      h1 { margin: 0; font: 600 clamp(28px, 5vw, 44px)/1.1 var(--mono); letter-spacing: -0.01em; text-wrap: balance; }
      header p { margin: 10px 0 0; max-width: 60ch; color: var(--muted); }
      h2 { margin: 0 0 14px; font: 600 12px/1 var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
      .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
      .grid.wide { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
      .card {
        display: grid;
        align-content: start;
        gap: 8px;
        padding: 10px 10px 14px;
        background: var(--panel);
        border: 1px solid var(--line);
        color: inherit;
        text-decoration: none;
        transition: border-color 0.15s, transform 0.15s;
      }
      .card:hover { border-color: var(--line-hover); transform: translateY(-2px); }
      .card:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
      .card canvas { display: block; width: 100%; aspect-ratio: 16 / 10; background: #000; font-family: var(--mono); }
      .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; font: 600 14px/1.3 var(--mono); }
      .chip { padding: 4px 7px; border: 1px solid currentColor; font: 600 11px/1 var(--mono); letter-spacing: 0.06em; }
      .chip.color { color: var(--chip-color); }
      .chip.grey { color: var(--chip-grey); }
      .about { min-width: 0; color: var(--muted); font-size: 13.5px; }
      #stage { position: fixed; inset: 0; background: #000; }
      #stage canvas { display: block; width: 100%; height: 100%; font-family: var(--mono); }
      #stage nav {
        position: fixed;
        top: calc(12px + env(safe-area-inset-top, 0px));
        left: max(16px, env(safe-area-inset-left, 0px));
        display: flex;
        align-items: baseline;
        gap: 14px;
        font: 600 13px var(--mono);
        color: var(--muted);
        text-shadow: 0 0 4px #000, 0 0 8px #000;
      }
      #stage nav a { color: var(--fg); text-decoration: none; }
      #stage nav a:focus-visible { outline: 1px solid var(--fg); outline-offset: 2px; }
      @media (prefers-reduced-motion: reduce) {
        .card { transition: none; }
        .card:hover { transform: none; }
      }
    </style>
  </head>
  <body>
    <div id="home" class="wrap">
      <header>
        <h1>ascii collection</h1>
        <p>Living ASCII scenes drawn on a canvas. Pick one to open it full-screen; Escape or the back link brings you here.</p>
      </header>
      <section aria-labelledby="h-insects">
        <h2 id="h-insects">insects</h2>
        <div class="grid" id="insects"></div>
      </section>
      <section aria-labelledby="h-nature">
        <h2 id="h-nature">nature</h2>
        <div class="grid wide" id="nature"></div>
      </section>
    </div>
    <div id="stage" hidden>
      <canvas aria-hidden="true"></canvas>
      <nav aria-label="Scene"><a href="#">← all scenes</a><span id="stage-title"></span></nav>
    </div>
    <script type="module" src="./src/home.ts"></script>
  </body>
</html>
